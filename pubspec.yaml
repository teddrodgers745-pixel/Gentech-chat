name: gentech_chat
description: Личный чат-клиент для DeepSeek и OpenAI-совместимых API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  # Стандартный SHA-256 для PKCE code_challenge (RFC 7636, метод S256).
  crypto: ^3.0.0
  # R6-audio-robustness-3, п.6: проверенные версии вместо any.
  # Обновления проверять вместе с lockfile (pub get / pub upgrade --lockfile-only).
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.0
  # Продолжение discontinued flutter_markdown (Foresight Mobile), ветка 1.0.x.
  # F4-markdown: не ниже 1.0.12 — в 1.0.8 починен жирный/курсив/ссылки
  # внутри blockquote, в 1.0.9 — дублирование хвостового текста у
  # кастомных inline-builders на элементах, разбитых `*`-делимитерами.
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0
  # Пин версии: в новых мажорных релизах file_picker убрали
  # FilePicker.platform, а код рассчитан на стабильный API 10.x.
  file_picker: ^10.1.2
  # Файлы от модели: сохранение в Documents/GenTech и системный шэринг.
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  # Предпросмотр файлов: WebView для HTML/SVG, загружаемых из локальной строки.
  webview_flutter: ^4.8.0
  # Сжатие изображений-вложений в изоляте (чистый Dart, без нативного кода).
  image: ^4.2.0
  # Озвучка ответов модели (TTS); ветка 4.x, код не зависит от API 5.x.
  flutter_tts: ^4.0.0
  # Голосовой ввод (Speech-to-Text) и запрос разрешения на микрофон.
  speech_to_text: ^7.0.0
  permission_handler: ^11.0.0
  # SVG-иконки капсул «Поиск» и «Мышление» в панели ввода.
  flutter_svg: ^2.0.9
  # Открытие страницы моделей провайдера в браузере (без ключа).
  url_launcher: ^6.3.0
  # Воспроизведение видео из VideoPart (асинхронные видео-задачи).
  video_player: ^2.9.2
  # Голосовой Live-режим: собственный WebSocket (BidiGenerateContent),
  # запись PCM 16-bit через record, воспроизведение через flutter_soloud.
  web_socket_channel: ^3.0.0
  record: ^5.1.2
  just_audio: ^0.9.40
  flutter_soloud: 3.0.1

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # G1-video-player: виджет-тесты подменяют платформенную реализацию
  # video_player (VideoPlayerPlatform.instance = фейк), чтобы проверять
  # play/pause/повтор/полный экран без реального декодера.
  video_player_platform_interface: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/
    - assets/model_presets.json
