name: gentech_chat
description: Личный чат-клиент для DeepSeek и OpenAI-совместимых API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  http: any
  shared_preferences: any
  google_fonts: any
  flutter_markdown_plus: any
  markdown: any
  flutter_highlight: any
  # Пин версии: в новых мажорных релизах file_picker убрали
  # FilePicker.platform, а код рассчитан на стабильный API 10.x.
  file_picker: ^10.1.2
  # Файлы от модели: сохранение в Documents/GenTech и системный шэринг.
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  # Предпросмотр файлов: WebView для HTML/SVG, загружаемых из локальной строки.
  webview_flutter: ^4.8.0
  # Сжатие изображений-вложений в изоляте (чистый Dart, без нативного кода).
  image: ^4.2.0
  # Озвучка ответов модели (TTS).
  flutter_tts: any
  # Голосовой ввод (Speech-to-Text) и запрос разрешения на микрофон.
  speech_to_text: ^7.0.0
  permission_handler: ^11.0.0
  # SVG-иконки капсул «Поиск» и «Мышление» в панели ввода.
  flutter_svg: ^2.0.9
  # Открытие страницы моделей провайдера в браузере (без ключа).
  url_launcher: ^6.3.0
  # Воспроизведение видео из VideoPart (асинхронные видео-задачи).
  video_player: ^2.9.2
  # Голосовой Live-режим: собственный WebSocket (BidiGenerateContent),
  # запись PCM 16-bit через record, воспроизведение через flutter_soloud.
  web_socket_channel: any
  record: ^5.1.2
  just_audio: ^0.9.40
  flutter_soloud: 3.0.1

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/
    - assets/model_presets.json
