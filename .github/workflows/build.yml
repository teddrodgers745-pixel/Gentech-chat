name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name gentech_chat --org app.gentech .
          rm -f test/widget_test.dart

      - name: Add INTERNET permission and app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="GenTech Chat"|' "$MANIFEST"

      - name: Apply Android patch (permissions, label, id, splash background)
        run: python3 tools/android_patch.py

      - run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gentech-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
